<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Chat Multiplayer - Netstationen Stil</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 320px;
            text-align: center;
        }
        input, button {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #333;
            background-color: #2a2a2a;
            color: #fff;
            box-sizing: border-box;
        }
        button {
            background-color: #28a745;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #218838;
        }
        .error {
            color: #ff4d4d;
            font-size: 14px;
            margin-top: 10px;
        }
        #game-container {
            display: none;
            position: relative;
            width: 700px;
            text-align: center;
        }
        #online-indicator {
            position: absolute;
            top: -25px;
            left: 0;
            background-color: #2a0000;
            color: #fff;
            padding: 4px 10px;
            font-size: 12px;
            font-weight: bold;
            border: 1px solid #444;
            border-radius: 4px;
        }
        #main-workspace {
            display: flex;
            gap: 10px;
            justify-content: center;
            position: relative;
            margin-top: 5px;
        }
        canvas {
            background: #1a1a1a;
            display: block;
            border: 2px solid #444;
            border-radius: 5px;
            cursor: pointer;
        }
        #right-panel {
            width: 280px;
            height: 374px;
            background-color: #1a1a1a;
            border: 2px solid #444;
            border-radius: 5px;
            display: flex;
            flex-direction: column;
        }
        .panel-header {
            background-color: #2a0000;
            color: #fff;
            padding: 8px;
            font-weight: bold;
            text-align: center;
            border-bottom: 1px solid #444;
        }
        .panel-body {
            flex: 1;
            padding: 10px;
            overflow-y: auto;
            font-size: 12px;
            text-align: left;
        }
        .panel-tab {
            display: none;
            height: 100%;
            flex-direction: column;
        }
        .panel-tab.active {
            display: flex;
        }
        .log-message {
            margin-bottom: 6px;
            word-break: break-all;
        }
        #bottom-toolbar {
            display: flex;
            background-color: #1a0000;
            border: 2px solid #444;
            border-radius: 5px;
            margin-top: 8px;
            padding: 5px;
            gap: 5px;
        }
        .tool-btn {
            background: #330000;
            border: 1px solid #555;
            color: #fff;
            padding: 6px 12px;
            cursor: pointer;
            border-radius: 3px;
            font-size: 12px;
            width: auto;
            margin: 0;
        }
        .tool-btn:hover, .tool-btn.active {
            background: #550000;
        }
    </style>
</head>
<body>

    <div class="container" id="login-section">
        <h2>2D Chat</h2>
        <input type="text" id="username-input" placeholder="Indtast dit brugernavn...">
        <button id="join-btn">Start Spil</button>
        <div id="error-msg" class="error"></div>
    </div>

    <div id="game-container">
        <div id="online-indicator">Online: 1</div>

        <div id="main-workspace">
            <canvas id="gameCanvas" width="408" height="374"></canvas>
            
            <div id="right-panel">
                <div class="panel-header" id="panel-title">Tekstboks</div>
                <div class="panel-body">
                    
                    <div class="panel-tab active" id="tab-chatlog">
                        <div id="chatlog-content" style="flex: 1; overflow-y: auto;">
                            <div class="log-message">Velkommen til chatten!</div>
                        </div>
                    </div>

                    <div class="panel-tab" id="tab-online">
                        <div id="online-users-list">Indlæser online brugere...</div>
                    </div>

                </div>
            </div>
        </div>

        <div id="bottom-toolbar">
            <button class="tool-btn active" id="btn-chat">💬 Tekstboks</button>
            <button class="tool-btn" id="btn-online">👥 Online brugere</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        const loginSection = document.getElementById('login-section');
        const gameContainer = document.getElementById('game-container');
        const usernameInput = document.getElementById('username-input');
        const joinBtn = document.getElementById('join-btn');
        const errorMsg = document.getElementById('error-msg');
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const chatlogContent = document.getElementById('chatlog-content');
        const onlineIndicator = document.getElementById('online-indicator');

        let players = {};
        let myId = null;
        const radius = 16;
        const gridSize = 48;
        let currentTyping = '';

        function updateOnlineCount() {
            const count = Object.keys(players).length;
            onlineIndicator.innerText = `Online: ${count}`;
        }

        function switchTab(tabName, titleText, btnElement) {
            document.querySelectorAll('.panel-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
            
            document.getElementById('tab-' + tabName).classList.add('active');
            document.getElementById('panel-title').innerText = titleText;
            btnElement.classList.add('active');
        }

        document.getElementById('btn-chat').addEventListener('click', function() {
            switchTab('chatlog', 'Tekstboks', this);
        });

        document.getElementById('btn-online').addEventListener('click', function() {
            switchTab('online', 'Online brugere', this);
            const listDiv = document.getElementById('online-users-list');
            listDiv.innerHTML = '';
            Object.values(players).forEach(p => {
                const userRow = document.createElement('div');
                userRow.style.padding = '6px 0';
                userRow.style.borderBottom = '1px solid #333';
                userRow.innerHTML = `👤 <b>${p.name}</b>`;
                listDiv.appendChild(userRow);
            });
        });

        function addChatLog(sender, text) {
            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            const div = document.createElement('div');
            div.className = 'log-message';
            div.innerHTML = `<b>${sender}:</b> ${text} <span style="color:#777; font-size:10px; white-space: nowrap;">${time}</span>`;
            chatlogContent.appendChild(div);
            chatlogContent.scrollTop = chatlogContent.scrollHeight;
        }

        function handleJoin() {
            const username = usernameInput.value.trim();
            errorMsg.innerText = '';
            if (!username) {
                errorMsg.innerText = 'Indtast venligst et brugernavn.';
                return;
            }
            socket.emit('join', username);
        }

        joinBtn.addEventListener('click', handleJoin);
        usernameInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') handleJoin();
        });

        socket.on('error-msg', (msg) => { errorMsg.innerText = msg; });

        socket.on('join-success', (serverPlayers) => {
            players = serverPlayers;
            myId = socket.id;
            updateOnlineCount();
            loginSection.style.display = 'none';
            gameContainer.style.display = 'block';
            requestAnimationFrame(gameLoop);
        });

        socket.on('newPlayer', (player) => { 
            players[player.id] = player; 
            updateOnlineCount();
        });

        socket.on('playerMoved', (data) => {
            if (players[data.id]) {
                players[data.id].x = data.x;
                players[data.id].y = data.y;
            }
        });

        socket.on('playerChatMessage', (data) => {
            if (players[data.id]) {
                const p = players[data.id];
                p.text = data.text;
                p.messageTime = data.messageTime;
                addChatLog(p.name, data.text);
            }
        });

        socket.on('playerDisconnected', (id) => { 
            delete players[id]; 
            updateOnlineCount();
        });

        function snapToDiagonalGrid(x, y) {
            let cx = canvas.width / 2;
            let cy = canvas.height / 2;
            let dx = x - cx;
            let dy = y - cy;

            let angle = -Math.PI / 4;
            let cos = Math.cos(angle);
            let sin = Math.sin(angle);
            let rx = dx * cos - dy * sin;
            let ry = dx * sin + dy * cos;

            let snappedRx = Math.floor(rx / gridSize) * gridSize + gridSize / 2;
            let snappedRy = Math.floor(ry / gridSize) * gridSize + gridSize / 2;

            let backAngle = Math.PI / 4;
            let bCos = Math.cos(backAngle);
            let bSin = Math.sin(backAngle);
            let finalDx = snappedRx * bCos - snappedRy * bSin;
            let finalDy = snappedRx * bSin + snappedRy * bCos;

            return {
                x: Math.round(cx + finalDx),
                y: Math.round(cy + finalDy)
            };
        }

        canvas.addEventListener('click', (e) => {
            if (!myId || !players[myId]) return;
            const rect = canvas.getBoundingClientRect();
            const snapped = snapToDiagonalGrid(e.clientX - rect.left, e.clientY - rect.top);
            socket.emit('move', snapped);
        });

        window.addEventListener('keydown', (e) => {
            if (!myId || !players[myId]) return;

            if (document.activeElement && (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA')) {
                return;
            }

            if (e.key === 'Enter') {
                const finalMsg = currentTyping.trim();
                currentTyping = '';
                if (finalMsg) {
                    socket.emit('chat-message', finalMsg);
                }
            } else if (e.key === 'Backspace') {
                currentTyping = currentTyping.slice(0, -1);
            } else if (e.key.length === 1) {
                currentTyping += e.key;
            }
        });

        function getLines(context, text, maxWidth) {
            let words = text.split(' ');
            let lines = [];
            let currentLine = '';

            for (let i = 0; i < words.length; i++) {
                let word = words[i];
                if (context.measureText(word).width > maxWidth) {
                    if (currentLine) {
                        lines.push(currentLine);
                        currentLine = '';
                    }
                    let subWord = '';
                    for (let char of word) {
                        if (context.measureText(subWord + char).width <= maxWidth) {
                            subWord += char;
                        } else {
                            lines.push(subWord);
                            subWord = char;
                        }
                    }
                    if (subWord) {
                        currentLine = subWord;
                    }
                } else {
                    let testLine = currentLine ? currentLine + ' ' + word : word;
                    if (context.measureText(testLine).width <= maxWidth) {
                        currentLine = testLine;
                    } else {
                        if (currentLine) lines.push(currentLine);
                        currentLine = word;
                    }
                }
            }
            if (currentLine) {
                lines.push(currentLine);
            }
            return lines;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(canvas.width / 2, canvas.height / 2);
            ctx.rotate(Math.PI / 4);
            ctx.strokeStyle = '#252525';
            ctx.lineWidth = 1;
            let range = 500;
            for (let x = -range; x <= range; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, -range);
                ctx.lineTo(x, range);
                ctx.stroke();
            }
            for (let y = -range; y <= range; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(-range, y);
                ctx.lineTo(range, y);
                ctx.stroke();
            }
            ctx.restore();

            const now = Date.now();

            for (let id in players) {
                let p = players[id];

                ctx.beginPath();
                ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
                ctx.fillStyle = '#28a745';
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#fff';
                ctx.stroke();
                ctx.closePath();

                ctx.fillStyle = '#fff';
                ctx.font = '12px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(p.name, p.x, p.y - radius - 6);

                let displayText = (id === myId && currentTyping) ? currentTyping : p.text;
                let isMyTyping = (id === myId && currentTyping.length > 0);

                if (!isMyTyping && p.text && p.messageTime) {
                    let elapsed = now - p.messageTime;
                    if (elapsed > 5000) {
                        p.text = '';
                        p.messageTime = null;
                        displayText = '';
                    }
                }

                if (displayText) {
                    ctx.save();
                    if (isMyTyping) {
                        ctx.globalAlpha = 0.7;
                    } else if (p.messageTime) {
                        let elapsed = now - p.messageTime;
                        if (elapsed > 4000) {
                            ctx.globalAlpha = 1 - (elapsed - 4000) / 1000;
                        }
                    }

                    ctx.font = '12px Arial';
                    let maxWidth = 150;
                    let lines = getLines(ctx, displayText, maxWidth);
                    
                    let lineHeight = 16;
                    let padding = 8;
                    let bubbleWidth = 0;
                    lines.forEach(line => {
                        let w = ctx.measureText(line).width;
                        if (w > bubbleWidth) bubbleWidth = w;
                    });
                    bubbleWidth = Math.max(bubbleWidth + padding * 2, 35);
                    let bubbleHeight = lines.length * lineHeight + padding * 2;
                    
                    let bubbleX = p.x - bubbleWidth / 2;
                    let bubbleY = p.y - radius - bubbleHeight - 12;

                    if (bubbleX < 5) bubbleX = 5;
                    else if (bubbleX + bubbleWidth > canvas.width - 5) bubbleX = canvas.width - bubbleWidth - 5;

                    if (bubbleY < 5) {
                        bubbleY = 5;
                    }

                    ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
                    ctx.strokeStyle = '#28a745';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    if (ctx.roundRect) {
                        ctx.roundRect(bubbleX, bubbleY, bubbleWidth, bubbleHeight, 6);
                    } else {
                        ctx.rect(bubbleX, bubbleY, bubbleWidth, bubbleHeight);
                    }
                    ctx.fill();
                    ctx.stroke();

                    ctx.beginPath();
                    let tailTipX = Math.max(bubbleX + 10, Math.min(p.x, bubbleX + bubbleWidth - 10));
                    ctx.moveTo(tailTipX - 6, bubbleY + bubbleHeight);
                    ctx.lineTo(tailTipX + 6, bubbleY + bubbleHeight);
                    ctx.lineTo(tailTipX, bubbleY + bubbleHeight + 8);
                    ctx.closePath();
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
                    ctx.fill();
                    ctx.stroke();

                    ctx.fillStyle = '#fff';
                    ctx.textAlign = 'center';
                    for (let i = 0; i < lines.length; i++) {
                        ctx.fillText(lines[i], bubbleX + bubbleWidth / 2, bubbleY + padding + (i + 1) * lineHeight - 3);
                    }
                    ctx.restore();
                }
            }
        }

        function gameLoop() {
            draw();
            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
