<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Chat Multiplayer - Netstationen Stil</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 320px;
            text-align: center;
        }
        input, button {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #333;
            background-color: #2a2a2a;
            color: #fff;
            box-sizing: border-box;
        }
        button {
            background-color: #28a745;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #218838;
        }
        .error {
            color: #ff4d4d;
            font-size: 14px;
            margin-top: 10px;
        }
        #game-container {
            display: none;
            position: relative;
            width: 700px;
            text-align: center;
        }
        #main-workspace {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        canvas {
            background: #1a1a1a;
            display: block;
            border: 2px solid #444;
            border-radius: 5px;
            cursor: pointer;
        }
        #chatlog-panel {
            width: 280px;
            height: 374px;
            background-color: #1a1a1a;
            border: 2px solid #444;
            border-radius: 5px;
            display: flex;
            flex-direction: column;
        }
        .panel-header {
            background-color: #2a0000;
            color: #fff;
            padding: 8px;
            font-weight: bold;
            text-align: center;
            border-bottom: 1px solid #444;
        }
        .panel-body {
            flex: 1;
            padding: 10px;
            overflow-y: auto;
            font-size: 12px;
            text-align: left;
        }
        .log-message {
            margin-bottom: 6px;
            word-break: break-all;
        }
        .modal-overlay {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        .modal-content {
            background: #1e1e1e;
            border: 2px solid #c00;
            padding: 20px;
            width: 320px;
            border-radius: 5px;
            max-height: 300px;
            overflow-y: auto;
            text-align: left;
            color: #fff;
        }
        .modal-close {
            background: #c00;
            float: right;
            border: none;
            color: #fff;
            cursor: pointer;
            padding: 2px 6px;
        }
        #bottom-toolbar {
            display: flex;
            background-color: #1a0000;
            border: 2px solid #444;
            border-radius: 5px;
            margin-top: 8px;
            padding: 5px;
            gap: 5px;
        }
        .tool-btn {
            background: #330000;
            border: 1px solid #555;
            color: #fff;
            padding: 6px 12px;
            cursor: pointer;
            border-radius: 3px;
            font-size: 12px;
            width: auto;
            margin: 0;
        }
        .tool-btn:hover {
            background: #550000;
        }
    </style>
</head>
<body>

    <div class="container" id="login-section">
        <h2>2D Chat</h2>
        <input type="text" id="username-input" placeholder="Indtast dit brugernavn...">
        <button id="join-btn">Start Spil</button>
        <div id="error-msg" class="error"></div>
    </div>

    <div id="game-container">
        <div id="main-workspace">
            <canvas id="gameCanvas" width="408" height="374"></canvas>
            <div id="chatlog-panel">
                <div class="panel-header">Chatlog</div>
                <div class="panel-body" id="chatlog-content">
                    <div class="log-message">Velkommen til chatten!</div>
                </div>
            </div>
        </div>

        <div id="bottom-toolbar">
            <button class="tool-btn" id="btn-online">👥 Online brugere</button>
            <button class="tool-btn" id="btn-search">🔍 Søg</button>
        </div>
    </div>

    <div class="modal-overlay" id="modal-online">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModals()">X</button>
            <h3>Online brugere</h3>
            <div id="online-users-list">Indlæser...</div>
        </div>
    </div>

    <div class="modal-overlay" id="modal-search">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModals()">X</button>
            <h3>Søg bruger</h3>
            <input type="text" id="search-input" placeholder="Skriv brugernavn...">
            <button id="search-action-btn">Søg</button>
            <div id="search-results"></div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        const loginSection = document.getElementById('login-section');
        const gameContainer = document.getElementById('game-container');
        const usernameInput = document.getElementById('username-input');
        const joinBtn = document.getElementById('join-btn');
        const errorMsg = document.getElementById('error-msg');
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const chatlogContent = document.getElementById('chatlog-content');

        let players = {};
        let myId = null;
        const radius = 16;
        const gridSize = 48;
        let currentTyping = '';
        let typingTimeout = null;

        function closeModals() {
            document.getElementById('modal-online').style.display = 'none';
            document.getElementById('modal-search').style.display = 'none';
        }

        function addChatLog(sender, text) {
            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            const div = document.createElement('div');
            div.className = 'log-message';
            div.innerHTML = `<b>${sender}:</b> ${text} <span style="color:#777; font-size:10px;">${time}</span>`;
            chatlogContent.appendChild(div);
            chatlogContent.scrollTop = chatlogContent.scrollHeight;
        }

        function handleJoin() {
            const username = usernameInput.value.trim();
            errorMsg.innerText = '';
            if (!username) {
                errorMsg.innerText = 'Indtast venligst et brugernavn.';
                return;
            }
            socket.emit('join', username);
        }

        joinBtn.addEventListener('click', handleJoin);
        usernameInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') handleJoin();
        });

        socket.on('error-msg', (msg) => { errorMsg.innerText = msg; });

        socket.on('join-success', (serverPlayers) => {
            players = serverPlayers;
            myId = socket.id;
            loginSection.style.display = 'none';
            gameContainer.style.display = 'block';
            requestAnimationFrame(gameLoop);
        });

        socket.on('newPlayer', (player) => { players[player.id] = player; });
        socket.on('playerMoved', (data) => {
            if (players[data.id]) {
                players[data.id].x = data.x;
                players[data.id].y = data.y;
            }
        });

        socket.on('playerTyping', (data) => {
            if (players[data.id]) {
                players[data.id].typingText = data.typingText;
            }
        });

        socket.on('playerChatMessage', (data) => {
            if (players[data.id]) {
                const p = players[data.id];
                p.typingText = '';
                p.text = data.text;
                p.messageTime = data.messageTime;
                addChatLog(p.name, data.text);
            }
        });

        socket.on('playerDisconnected', (id) => { delete players[id]; });

        document.getElementById('btn-online').addEventListener('click', () => {
            const listDiv = document.getElementById('online-users-list');
            listDiv.innerHTML = '';
            Object.values(players).forEach(p => {
                const userRow = document.createElement('div');
                userRow.style.padding = '4px 0';
                userRow.style.borderBottom = '1px solid #333';
                userRow.innerHTML = `👤 <b>${p.name}</b>`;
                listDiv.appendChild(userRow);
            });
            document.getElementById('modal-online').style.display = 'flex';
        });

        document.getElementById('btn-search').addEventListener('click', () => {
            document.getElementById('modal-search').style.display = 'flex';
        });

        document.getElementById('search-action-btn').addEventListener('click', () => {
            const query = document.getElementById('search-input').value.toLowerCase();
            const resultsDiv = document.getElementById('search-results');
            resultsDiv.innerHTML = '';
            const matches = Object.values(players).filter(p => p.name.toLowerCase().includes(query));
            if (matches.length === 0) {
                resultsDiv.innerHTML = '<p style="color:#aaa;">Ingen brugere fundet.</p>';
            } else {
                matches.forEach(m => {
                    resultsDiv.innerHTML += `<div style="padding:5px; border-bottom:1px solid #444;">Fandt: <b>${m.name}</b> (Online)</div>`;
                });
            }
        });

        function snapToDiagonalGrid(x, y) {
            let cx = canvas.width / 2;
            let cy = canvas.height / 2;
            let dx = x - cx;
            let dy = y - cy;
            let angle = -Math.PI / 4;
            let rx = dx * Math.cos(angle) - dy * Math.sin(angle);
            let ry = dx * Math.sin(angle) + dy * Math.cos(angle);
            let snappedRx = Math.floor(rx / gridSize) * gridSize + gridSize / 2;
            let snappedRy = Math.floor(ry / gridSize) * gridSize + gridSize / 2;
            let finalDx = snappedRx * Math.cos(-angle) - snappedRy * Math.sin(-angle);
            let finalDy = snappedRx * Math.sin(-angle) + snappedRy * Math.cos(-angle);
            return {
                x: Math.round(cx + finalDx),
                y: Math.round(cy + finalDy)
            };
        }

        canvas.addEventListener('click', (e) => {
            if (!myId || !players[myId]) return;
            const rect = canvas.getBoundingClientRect();
            const snapped = snapToDiagonalGrid(e.clientX - rect.left, e.clientY - rect.top);
            socket.emit('move', snapped);
        });

        window.addEventListener('keydown', (e) => {
            if (!myId || !players[myId]) return;
            let p = players[myId];

            if (e.key === 'Enter') {
                clearTimeout(typingTimeout);
                const finalMsg = currentTyping.trim();
                currentTyping = '';
                p.typingText = '';
                if (finalMsg) {
                    socket.emit('chat-message', finalMsg);
                }
            } else if (e.key === 'Backspace') {
                currentTyping = currentTyping.slice(0, -1);
                p.typingText = currentTyping;
                clearTimeout(typingTimeout);
                typingTimeout = setTimeout(() => {
                    socket.emit('typing', { typingText: currentTyping });
                }, 200);
            } else if (e.key.length === 1) {
                currentTyping += e.key;
                p.typingText = currentTyping;
                clearTimeout(typingTimeout);
                typingTimeout = setTimeout(() => {
                    socket.emit('typing', { typingText: currentTyping });
                }, 200);
            }
        });

        function getLines(context, text, maxWidth) {
            let words = text.split(' ');
            let lines = [];
            let currentLine = words[0];

            for (let i = 1; i < words.length; i++) {
                let word = words[i];
                let width = context.measureText(currentLine + " " + word).width;
                if (width < maxWidth) {
                    currentLine += " " + word;
                } else {
                    lines.push(currentLine);
                    currentLine = word;
                }
            }
            lines.push(currentLine);
            return lines;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(canvas.width / 2, canvas.height / 2);
            ctx.rotate(Math.PI / 4);
            ctx.strokeStyle = '#252525';
            ctx.lineWidth = 1;
            let range = 500;
            for (let x = -range; x <= range; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, -range);
                ctx.lineTo(x, range);
                ctx.stroke();
            }
            for (let y = -range; y <= range; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(-range, y);
                ctx.lineTo(range, y);
                ctx.stroke();
            }
            ctx.restore();

            const now = Date.now();

            for (let id in players) {
                let p = players[id];

                ctx.beginPath();
                ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
                ctx.fillStyle = '#28a745';
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#fff';
                ctx.stroke();
                ctx.closePath();

                ctx.fillStyle = '#fff';
                ctx.font = '12px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(p.name, p.x, p.y - radius - 6);

                let displayText = p.typingText || p.text;
                let isTyping = !!p.typingText;

                if (!isTyping && p.text && p.messageTime) {
                    let elapsed = now - p.messageTime;
                    if (elapsed > 5000) {
                        p.text = '';
                        p.messageTime = null;
                        displayText = '';
                    }
                }

                if (displayText) {
                    ctx.save();
                    if (isTyping) {
                        ctx.globalAlpha = 0.7;
                    } else if (p.messageTime) {
                        let elapsed = now - p.messageTime;
                        if (elapsed > 4000) {
                            ctx.globalAlpha = 1 - (elapsed - 4000) / 1000;
                        }
                    }

                    ctx.font = '12px Arial';
                    let maxWidth = 150;
                    let lines = getLines(ctx, displayText, maxWidth);
                    
                    let lineHeight = 16;
                    let padding = 8;
                    let bubbleWidth = 0;
                    lines.forEach(line => {
                        let w = ctx.measureText(line).width;
                        if (w > bubbleWidth) bubbleWidth = w;
                    });
                    bubbleWidth = Math.max(bubbleWidth + padding * 2, 35);
                    let bubbleHeight = lines.length * lineHeight + padding * 2;
                    
                    let bubbleX = p.x - bubbleWidth / 2;
                    let bubbleY = p.y - radius - bubbleHeight - 12;
                    let tailPointsUp = false;

                    if (bubbleX < 5) bubbleX = 5;
                    else if (bubbleX + bubbleWidth > canvas.width - 5) bubbleX = canvas.width - bubbleWidth - 5;

                    if (bubbleY < 5) {
                        bubbleY = p.y + radius + 12;
                        tailPointsUp = true;
                    }

                    ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
                    ctx.strokeStyle = '#28a745';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    if (ctx.roundRect) {
                        ctx.roundRect(bubbleX, bubbleY, bubbleWidth, bubbleHeight, 6);
                    } else {
                        ctx.rect(bubbleX, bubbleY, bubbleWidth, bubbleHeight);
                    }
                    ctx.fill();
                    ctx.stroke();

                    ctx.beginPath();
                    let tailTipX = Math.max(bubbleX + 10, Math.min(p.x, bubbleX + bubbleWidth - 10));
                    if (!tailPointsUp) {
                        ctx.moveTo(tailTipX - 6, bubbleY + bubbleHeight);
                        ctx.lineTo(tailTipX + 6, bubbleY + bubbleHeight);
                        ctx.lineTo(p.x, bubbleY + bubbleHeight + 8);
                    } else {
                        ctx.moveTo(tailTipX - 6, bubbleY);
                        ctx.lineTo(tailTipX + 6, bubbleY);
                        ctx.lineTo(p.x, bubbleY - 8);
                    }
                    ctx.closePath();
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
                    ctx.fill();
                    ctx.stroke();

                    ctx.fillStyle = '#fff';
                    ctx.textAlign = 'center';
                    for (let i = 0; i < lines.length; i++) {
                        ctx.fillText(lines[i], p.x, bubbleY + padding + (i + 1) * lineHeight - 3);
                    }
                    ctx.restore();
                }
            }
        }

        function gameLoop() {
            draw();
            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
