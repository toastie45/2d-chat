<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Chat Multiplayer</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 320px;
            text-align: center;
        }
        input, button {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #333;
            background-color: #2a2a2a;
            color: #fff;
            box-sizing: border-box;
        }
        button {
            background-color: #28a745;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #218838;
        }
        .error {
            color: #ff4d4d;
            font-size: 14px;
            margin-top: 10px;
        }
        #game-container {
            display: none;
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        canvas {
            background: #222;
            display: block;
            margin: auto;
        }
    </style>
</head>
<body>

    <!-- START SKÆRM -->
    <div class="container" id="login-section">
        <h2>2D Chat</h2>
        <input type="text" id="username-input" placeholder="Indtast dit brugernavn...">
        <button onclick="joinGame()">Start Spil</button>
        <div id="error-msg" class="error"></div>
    </div>

    <!-- SPILLET -->
    <div id="game-container">
        <canvas id="gameCanvas" width="408" height="374"></canvas>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        function joinGame() {
            const username = document.getElementById('username-input').value.trim();
            const errorDiv = document.getElementById('error-msg');
            errorDiv.innerText = '';

            if (!username) {
                errorDiv.innerText = 'Indtast venligst et brugernavn.';
                return;
            }

            socket.emit('join', username);
        }

        socket.on('error-msg', (msg) => {
            document.getElementById('error-msg').innerText = msg;
        });

        socket.on('join-success', (players) => {
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('game-container').style.display = 'block';
        });
    </script>
</body>
</html>
