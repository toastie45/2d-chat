<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Chat Multiplayer</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 320px;
            text-align: center;
        }
        input, button {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #333;
            background-color: #2a2a2a;
            color: #fff;
            box-sizing: border-box;
        }
        button {
            background-color: #28a745;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #218838;
        }
        .error {
            color: #ff4d4d;
            font-size: 14px;
            margin-top: 10px;
        }
        #game-container {
            display: none;
            position: relative;
            text-align: center;
        }
        canvas {
            background: #222;
            display: block;
            margin: 0 auto;
            border: 2px solid #444;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- START SKÆRM -->
    <div class="container" id="login-section">
        <h2>2D Chat</h2>
        <input type="text" id="username-input" placeholder="Indtast dit brugernavn...">
        <button onclick="joinGame()">Start Spil</button>
        <div id="error-msg" class="error"></div>
    </div>

    <!-- SPILLET -->
    <div id="game-container">
        <canvas id="gameCanvas" width="408" height="374"></canvas>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        const loginSection = document.getElementById('login-section');
        const gameContainer = document.getElementById('game-container');
        const usernameInput = document.getElementById('username-input');
        const errorMsg = document.getElementById('error-msg');
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let players = {};
        let myId = null;
        const radius = 16;
        let currentTyping = '';

        function joinGame() {
            const username = usernameInput.value.trim();
            errorMsg.innerText = '';

            if (!username) {
                errorMsg.innerText = 'Indtast venligst et brugernavn.';
                return;
            }

            socket.emit('join', username);
        }

        socket.on('error-msg', (msg) => {
            errorMsg.innerText = msg;
        });

        socket.on('join-success', (serverPlayers) => {
            players = serverPlayers;
            myId = socket.id;
            loginSection.style.display = 'none';
            gameContainer.style.display = 'block';
            requestAnimationFrame(gameLoop);
        });

        socket.on('newPlayer', (player) => {
            players[player.id] = player;
        });

        socket.on('playerMoved', (data) => {
            if (players[data.id]) {
                players[data.id].x = data.x;
                players[data.id].y = data.y;
            }
        });

        socket.on('playerTyping', (data) => {
            if (players[data.id]) {
                players[data.id].typingText = data.typingText;
                players[data.id].text = data.text;
                players[data.id].messageTime = data.messageTime;
            }
        });

        socket.on('playerDisconnected', (id) => {
            delete players[id];
        });

        // Klik med musen for at flytte cirklen
        canvas.addEventListener('click', (e) => {
            if (!myId || !players[myId]) return;
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            socket.emit('move', { x: Math.round(x), y: Math.round(y) });
        });

        // Skriv direkte via tastaturet
        window.addEventListener('keydown', (e) => {
            if (!myId || !players[myId]) return;

            if (e.key === 'Enter') {
                const finalMsg = currentTyping;
                currentTyping = '';
                players[myId].text = finalMsg;
                players[myId].typingText = '';
                players[myId].messageTime = Date.now();
                socket.emit('typing', { typingText: '', text: finalMsg });
            } else if (e.key === 'Backspace') {
                currentTyping = currentTyping.slice(0, -1);
                players[myId].typingText = currentTyping;
                players[myId].text = '';
                socket.emit('typing', { typingText: currentTyping, text: '' });
            } else if (e.key.length === 1) {
                currentTyping += e.key;
                players[myId].typingText = currentTyping;
                players[myId].text = '';
                socket.emit('typing', { typingText: currentTyping, text: '' });
            }
        });

        // Hjælpefunktion til at knække tekst i flere linjer (Word Wrap)
        function getLines(context, text, maxWidth) {
            let words = text.split(' ');
            let lines = [];
            let currentLine = words[0];

            for (let i = 1; i < words.length; i++) {
                let word = words[i];
                let width = context.measureText(currentLine + " " + word).width;
                if (width < maxWidth) {
                    currentLine += " " + word;
                } else {
                    lines.push(currentLine);
                    currentLine = word;
                }
            }
            lines.push(currentLine);
            return lines;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const now = Date.now();

            for (let id in players) {
                let p = players[id];

                // 1. Grøn cirkel for spilleren
                ctx.beginPath();
                ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
                ctx.fillStyle = '#28a745';
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#fff';
                ctx.stroke();
                ctx.closePath();

                // 2. Brugernavn ovenpå
                ctx.fillStyle = '#fff';
                ctx.font = '12px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(p.name, p.x, p.y - radius - 6);

                // 3. Håndtering af taleboble (tekst eller live-skrivning)
                let displayText = p.typingText || p.text;
                let isTyping = !!p.typingText;

                // Automatisk fjernelse / fade-out efter 5 sekunder for faste beskeder
                if (!isTyping && p.text && p.messageTime) {
                    let elapsed = now - p.messageTime;
                    if (elapsed > 5000) {
                        p.text = '';
                        p.messageTime = null;
                        displayText = '';
                    }
                }

                if (displayText) {
                    ctx.save();

                    // Hvis man bare er i gang med at skrive, er boblen lidt gennemsigtig. 
                    // Hvis beskeden er sendt, tjekker vi om den skal fade ud i det sidste sekund (fra 4 til 5 sekunder).
                    if (isTyping) {
                        ctx.globalAlpha = 0.7;
                    } else if (p.messageTime) {
                        let elapsed = now - p.messageTime;
                        if (elapsed > 4000) {
                            ctx.globalAlpha = 1 - (elapsed - 4000) / 1000;
                        }
                    }

                    ctx.font = '12px Arial';
                    let maxWidth = 150;
                    let lines = getLines(ctx, displayText, maxWidth);
                    
                    let lineHeight = 16;
                    let padding = 8;
                    let bubbleWidth = 0;
                    lines.forEach(line => {
                        let w = ctx.measureText(line).width;
                        if (w > bubbleWidth) bubbleWidth = w;
                    });
                    bubbleWidth = Math.max(bubbleWidth + padding * 2, 35);
                    let bubbleHeight = lines.length * lineHeight + padding * 2;
                    
                    let bubbleX = p.x - bubbleWidth / 2;
                    let bubbleY = p.y - radius - bubbleHeight - 12; // Plads til halen

                    // Tegn selve taleboblen med runde hjørner
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
                    ctx.strokeStyle = '#28a745';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    if (ctx.roundRect) {
                        ctx.roundRect(bubbleX, bubbleY, bubbleWidth, bubbleHeight, 6);
                    } else {
                        ctx.rect(bubbleX, bubbleY, bubbleWidth, bubbleHeight);
                    }
                    ctx.fill();
                    ctx.stroke();

                    // Tegn lille trekantet hale der peger på cirklen
                    ctx.beginPath();
                    ctx.moveTo(p.x - 6, bubbleY + bubbleHeight);
                    ctx.lineTo(p.x + 6, bubbleY + bubbleHeight);
                    ctx.lineTo(p.x, bubbleY + bubbleHeight + 8);
                    ctx.closePath();
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
                    ctx.fill();
                    ctx.stroke();

                    // Skriv teksten ind linje for linje
                    ctx.fillStyle = '#fff';
                    ctx.textAlign = 'center';
                    for (let i = 0; i < lines.length; i++) {
                        ctx.fillText(lines[i], p.x, bubbleY + padding + (i + 1) * lineHeight - 3);
                    }

                    ctx.restore();
                }
            }
        }

        function gameLoop() {
            draw();
            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
