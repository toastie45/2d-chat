<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2D Chat Multiplayer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: #fff;
    }
    #game-container {
      position: relative;
      width: 408px;
      height: 374px;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
      background-color: #000;
      overflow: hidden;
    }
    #login-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #1a1a1a;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 10;
    }
    #login-screen h2 {
      margin-bottom: 12px;
      font-size: 16px;
      color: #2ecc71;
    }
    .input-field {
      width: 85%;
      padding: 8px;
      margin-bottom: 10px;
      background: #000;
      border: 1px solid #444;
      color: #fff;
      font-size: 13px;
      border-radius: 4px;
      text-align: center;
    }
    .input-field:focus {
      outline: none;
      border-color: #2ecc71;
    }
    .action-btn {
      padding: 8px 18px;
      background-color: #2ecc71;
      color: #fff;
      border: none;
      font-size: 13px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
    }
    .action-btn:hover {
      background-color: #27ae60;
    }
    #error-msg {
      color: #e74c3c;
      font-size: 11px;
      margin-top: 8px;
      text-align: center;
      height: 15px;
    }
    #step-code {
      display: none;
    }
    canvas {
      display: none;
    }
  </style>
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>

  <div id="game-container">
    <div id="login-screen">
      <div id="step-info" style="display: flex; flex-direction: column; align-items: center; width: 100%;">
        <h2>Opret bruger</h2>
        <input type="text" id="username-input" class="input-field" placeholder="Brugernavn..." maxlength="15" autocomplete="off" />
        <input type="email" id="email-input" class="input-field" placeholder="Din e-mailadresse..." autocomplete="off" />
        <button id="send-code-btn" class="action-btn">Send verifikationskode</button>
      </div>

      <div id="step-code" style="display: flex; flex-direction: column; align-items: center; width: 100%;">
        <h2>Tjek din e-mail</h2>
        <p style="font-size: 11px; color: #aaa; margin-bottom: 10px; text-align: center;">Indtast den 6-cifrede kode sendt til din e-mail</p>
        <input type="text" id="code-input" class="input-field" placeholder="6-cifret kode..." maxlength="6" autocomplete="off" />
        <button id="verify-btn" class="action-btn">Bekræft & Deltag</button>
      </div>

      <div id="error-msg"></div>
    </div>

    <canvas width="408" height="374" id="focuscanvas" tabindex="0" style="width: 408px; height: 374px; position: absolute; left: 0px; top: 0px;"></canvas>
  </div>

  <script>
    const socket = io();
    const canvas = document.getElementById('focuscanvas');
    const ctx = canvas.getContext('2d');
    
    const loginScreen = document.getElementById('login-screen');
    const stepInfo = document.getElementById('step-info');
    const stepCode = document.getElementById('step-code');
    const usernameInput = document.getElementById('username-input');
    const emailInput = document.getElementById('email-input');
    const sendCodeBtn = document.getElementById('send-code-btn');
    const codeInput = document.getElementById('code-input');
    const verifyBtn = document.getElementById('verify-btn');
    const errorMsg = document.getElementById('error-msg');

    let players = {};
    let myId = null;
    let typingBuffer = '';
    let activeBubbleText = '';
    let bubbleTimeout = null;
    let gameStarted = false;

    sendCodeBtn.addEventListener('click', () => {
      const username = usernameInput.value.trim();
      const email = emailInput.value.trim();
      errorMsg.textContent = '';
      socket.emit('request-code', { username, email });
    });

    verifyBtn.addEventListener('click', () => {
      const code = codeInput.value.trim();
      errorMsg.textContent = '';
      socket.emit('verify-code', code);
    });

    socket.on('code-sent', (msg) => {
      stepInfo.style.display = 'none';
      stepCode.style.display = 'flex';
      errorMsg.style.color = '#2ecc71';
      errorMsg.textContent = msg;
    });

    socket.on('login-success', (serverPlayers) => {
      players = serverPlayers;
      loginScreen.style.display = 'none';
      canvas.style.display = 'block';
      canvas.focus();
      gameStarted = true;
    });

    socket.on('error-msg', (msg) => {
      errorMsg.style.color = '#e74c3c';
      errorMsg.textContent = msg;
    });

    socket.on('connect', () => {
      myId = socket.id;
    });

    socket.on('currentPlayers', (serverPlayers) => {
      players = serverPlayers;
    });

    socket.on('newPlayer', (player) => {
      players[player.id] = player;
    });

    socket.on('playerMoved', (data) => {
      if (players[data.id]) {
        players[data.id].x = data.x;
        players[data.id].y = data.y;
      }
    });

    socket.on('playerTyping', (data) => {
      if (players[data.id]) {
        players[data.id].typingText = data.typingText;
        players[data.id].text = data.text;
      }
    });

    socket.on('playerDisconnected', (id) => {
      delete players[id];
    });

    canvas.addEventListener('click', (e) => {
      if (!gameStarted) return;
      const rect = canvas.getBoundingClientRect();
      const clickX = Math.round(e.clientX - rect.left);
      const clickY = Math.round(e.clientY - rect.top);

      if (myId && players[myId]) {
        socket.emit('move', { x: clickX, y: clickY });
      }
    });

    window.addEventListener('keydown', (e) => {
      if (!gameStarted || !myId || !players[myId]) return;

      if (e.key === 'Backspace') {
        typingBuffer = typingBuffer.slice(0, -1);
      } else if (e.key === 'Enter') {
        if (typingBuffer.trim().length > 0) {
          activeBubbleText = typingBuffer;
          typingBuffer = '';

          if (bubbleTimeout) clearTimeout(bubbleTimeout);
          bubbleTimeout = setTimeout(() => {
            activeBubbleText = '';
            socket.emit('typing', { typingText: '', text: '' });
          }, 4000);
        }
      } else if (e.key.length === 1 && typingBuffer.length < 35) {
        typingBuffer += e.key;
      }

      socket.emit('typing', { 
        typingText: typingBuffer, 
        text: activeBubbleText 
      });
    });

    let showCursor = true;
    setInterval(() => { showCursor = !showCursor; }, 500);

    function draw() {
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (gameStarted) {
        for (const id in players) {
          const p = players[id];
          const isMe = (id === myId);

          ctx.fillStyle = '#2ecc71';
          ctx.beginPath();
          ctx.arc(p.x, p.y, 16, 0, Math.PI * 2);
          ctx.fill();

          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 2;
          ctx.stroke();

          ctx.fillStyle = '#ffffff';
          ctx.font = '10px Arial';
          ctx.textAlign = 'center';
          ctx.fillText(p.name, p.x, p.y + 28);

          const displayText = p.text || p.typingText;
          const isTypingActive = p.typingText && !p.text;

          if (displayText || (isMe && typingBuffer)) {
            const txt = isMe ? (typingBuffer || activeBubbleText) : displayText;
            if (txt || (isMe && typingBuffer !== '')) {
              drawBubble(p.x, p.y - 22, txt + (isMe && isTypingActive && showCursor ? '|' : ''));
            }
          }
        }
      }

      requestAnimationFrame(draw);
    }

    function drawBubble(x, y, text) {
      ctx.font = '12px Arial';
      const textWidth = ctx.measureText(text).width;
      const padding = 8;
      const bw = textWidth + padding * 2;
      const bh = 22;
      const bx = x - bw / 2;
      const by = y - bh;

      ctx.fillStyle = '#e2e8f0';
      ctx.strokeStyle = '#000000';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.rect(bx, by, bw, bh);
      ctx.fill();
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(x - 5, by + bh);
      ctx.lineTo(x, by + bh + 6);
      ctx.lineTo(x + 5, by + bh);
      ctx.fillStyle = '#e2e8f0';
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#000000';
      ctx.textAlign = 'left';
      ctx.fillText(text, bx + padding, by + 15);
    }

    draw();
  </script>
</body>
</html>
