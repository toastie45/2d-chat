<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Chat Oprettelse</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 320px;
            text-align: center;
        }
        input, button {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #333;
            background-color: #2a2a2a;
            color: #fff;
            box-sizing: border-box;
        }
        button {
            background-color: #28a745;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #218838;
        }
        .error {
            color: #ff4d4d;
            font-size: 14px;
            margin-top: 10px;
        }
        .success {
            color: #28a745;
            font-size: 14px;
            margin-top: 10px;
        }
        a {
            color: #28a745;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="container" id="register-container">
        <h2>Opret bruger</h2>
        <input type="text" id="reg-username" placeholder="Brugernavn...">
        <input type="email" id="reg-email" placeholder="E-mail...">
        <div style="text-align: left; font-size: 12px; color: #aaa; margin-top: 5px;">Fødselsdato (kræver 13 år):</div>
        <input type="date" id="reg-birthdate">
        
        <div style="text-align: left; font-size: 12px; margin: 10px 0;">
            <input type="checkbox" id="reg-terms" style="width: auto; margin-right: 5px;"> Jeg har forstået og accepterer reglerne
        </div>

        <button onclick="registerUser()">Send verifikationskode</button>
        <div id="reg-msg"></div>
        <div style="margin-top: 15px;">
            <a href="#" onclick="showLogin()">Har du allerede en konto? Log ind</a>
        </div>
    </div>

    <!-- Socket.io bibliotek -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        function registerUser() {
            const username = document.getElementById('reg-username').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const birthdate = document.getElementById('reg-birthdate').value;
            const terms = document.getElementById('reg-terms').checked;
            const msgDiv = document.getElementById('reg-msg');

            msgDiv.className = '';
            msgDiv.innerText = '';

            if (!username || !email || !birthdate) {
                msgDiv.className = 'error';
                msgDiv.innerText = 'Udfyld venligst alle felter.';
                return;
            }

            if (!terms) {
                msgDiv.className = 'error';
                msgDiv.innerText = 'Du skal acceptere reglerne.';
                return;
            }

            // Sender til serveren uden krav om kodeord i frontend
            socket.emit('request-code', { username, email, birthdate });
        }

        socket.on('error-msg', (msg) => {
            const msgDiv = document.getElementById('reg-msg');
            msgDiv.className = 'error';
            msgDiv.innerText = msg;
        });

        socket.on('code-sent', (msg) => {
            const msgDiv = document.getElementById('reg-msg');
            msgDiv.className = 'success';
            msgDiv.innerText = msg;
        });

        function showLogin() {
            // Hvis du har et separat login-view, kan det styres herfra
            alert('Skift til login-visning');
        }
    </script>
</body>
</html>
