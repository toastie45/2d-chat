<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Chat Multiplayer</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 320px;
            text-align: center;
        }
        input, button {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #333;
            background-color: #2a2a2a;
            color: #fff;
            box-sizing: border-box;
        }
        button {
            background-color: #28a745;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #218838;
        }
        .error {
            color: #ff4d4d;
            font-size: 14px;
            margin-top: 10px;
        }
        #game-container {
            display: none;
            position: relative;
            text-align: center;
        }
        canvas {
            background: #222;
            display: block;
            margin: 0 auto;
            border: 2px solid #444;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- START SKÆRM -->
    <div class="container" id="login-section">
        <h2>2D Chat</h2>
        <input type="text" id="username-input" placeholder="Indtast dit brugernavn...">
        <button onclick="joinGame()">Start Spil</button>
        <div id="error-msg" class="error"></div>
    </div>

    <!-- SPILLET -->
    <div id="game-container">
        <canvas id="gameCanvas" width="408" height="374"></canvas>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        const loginSection = document.getElementById('login-section');
        const gameContainer = document.getElementById('game-container');
        const usernameInput = document.getElementById('username-input');
        const errorMsg = document.getElementById('error-msg');
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let players = {};
        let myId = null;
        const radius = 16;
        let currentTyping = '';
        let currentMessage = '';

        function joinGame() {
            const username = usernameInput.value.trim();
            errorMsg.innerText = '';

            if (!username) {
                errorMsg.innerText = 'Indtast venligst et brugernavn.';
                return;
            }

            socket.emit('join', username);
        }

        socket.on('error-msg', (msg) => {
            errorMsg.innerText = msg;
        });

        socket.on('join-success', (serverPlayers) => {
            players = serverPlayers;
            myId = socket.id;
            loginSection.style.display = 'none';
            gameContainer.style.display = 'block';
            requestAnimationFrame(gameLoop);
        });

        socket.on('newPlayer', (player) => {
            players[player.id] = player;
        });

        socket.on('playerMoved', (data) => {
            if (players[data.id]) {
                players[data.id].x = data.x;
                players[data.id].y = data.y;
            }
        });

        socket.on('playerTyping', (data) => {
            if (players[data.id]) {
                players[data.id].typingText = data.typingText;
                players[data.id].text = data.text;
            }
        });

        socket.on('playerDisconnected', (id) => {
            delete players[id];
        });

        // Klik med musen for at flytte cirklen
        canvas.addEventListener('click', (e) => {
            if (!myId || !players[myId]) return;
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            socket.emit('move', { x: Math.round(x), y: Math.round(y) });
        });

        // Skriv direkte via tastaturet uden tekstbar
        window.addEventListener('keydown', (e) => {
            if (!myId || !players[myId]) return;

            // Ignorer piltaster eller specielle taster, hvis det er relevant, ellers fang bogstaver
            if (e.key === 'Enter') {
                currentMessage = currentTyping;
                currentTyping = '';
                players[myId].text = currentMessage;
                players[myId].typingText = '';
                socket.emit('typing', { typingText: '', text: currentMessage });
            } else if (e.key === 'Backspace') {
                currentTyping = currentTyping.slice(0, -1);
                players[myId].typingText = currentTyping;
                socket.emit('typing', { typingText: currentTyping, text: currentMessage });
            } else if (e.key.length === 1) {
                currentTyping += e.key;
                players[myId].typingText = currentTyping;
                socket.emit('typing', { typingText: currentTyping, text: currentMessage });
            }
        });

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let id in players) {
                let p = players[id];

                // Grøn cirkel for alle
                ctx.beginPath();
                ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
                ctx.fillStyle = '#28a745';
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#fff';
                ctx.stroke();
                ctx.closePath();

                // Brugernavn
                ctx.fillStyle = '#fff';
                ctx.font = '12px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(p.name, p.x, p.y - radius - 6);

                // Tekstboble
                let displayText = p.typingText || p.text;
                if (displayText) {
                    ctx.font = '12px Arial';
                    let textWidth = ctx.measureText(displayText).width;
                    let bubbleWidth = Math.max(textWidth + 16, 30);
                    let bubbleHeight = 22;
                    let bubbleX = p.x - bubbleWidth / 2;
                    let bubbleY = p.y - radius - 35;

                    ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
                    ctx.strokeStyle = '#28a745';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    if (ctx.roundRect) {
                        ctx.roundRect(bubbleX, bubbleY, bubbleWidth, bubbleHeight, 5);
                    } else {
                        ctx.rect(bubbleX, bubbleY, bubbleWidth, bubbleHeight);
                    }
                    ctx.fill();
                    ctx.stroke();

                    ctx.fillStyle = '#fff';
                    ctx.textAlign = 'center';
                    ctx.fillText(displayText, p.x, bubbleY + 15);
                }
            }
        }

        function gameLoop() {
            draw();
            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
